<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a090d}
body{position:relative;font-family:Anton,Impact,sans-serif;color:#f3eee6}
.bg{position:absolute;inset:0;background:url("../img/hero.jpg") 70% 20%/cover no-repeat;filter:saturate(.8)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(10,9,13,.95) 0%,rgba(10,9,13,.75) 50%,rgba(10,9,13,.3) 100%)}
.wrap{position:absolute;left:70px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#9a929e;margin-bottom:22px;display:flex;align-items:center;gap:14px}
.eyebrow i{width:10px;height:10px;border-radius:50%;background:#e0a040;box-shadow:0 0 16px #e0a040}
h1{margin:0;font-weight:400;font-size:190px;line-height:.86;text-transform:uppercase}
.l2{display:block;color:transparent;-webkit-text-stroke:3px #f3eee6}
.stick{display:inline-block;width:.17em;height:.92em;vertical-align:baseline;margin:0 .01em;transform:rotate(6deg);transform-origin:50% 100%;filter:drop-shadow(0 0 .08em rgba(224,160,64,.7))}
.stick svg{display:block;width:100%;height:100%}
.sub{margin-top:26px;font-family:"IBM Plex Mono",monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#e0a040}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
  <div class="eyebrow"><i></i>Drums · Percussion · Jazz</div>
  <h1><span>Joaquin</span><span class="l2">Ort<span class="stick"><svg viewBox="0 0 60 400" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3c469"/><stop offset=".45" stop-color="#e0a040"/><stop offset="1" stop-color="#8f5b1c"/></linearGradient></defs><ellipse cx="30" cy="16" rx="13" ry="15" fill="url(#g)"/><path d="M21 30 C23 24 37 24 39 30 L47 300 L48 396 L12 396 L13 300 Z" fill="url(#g)"/><path d="M24 50 L18 390" stroke="#fff" stroke-opacity=".28" stroke-width="3"/></svg></span>z</span></h1>
  <div class="sub">Oakland, CA ⇄ New York City · joaquinortizmusic.com</div>
</div>
</body></html>
